# =============================================================================
# nm-deploy — Stack completo Novedades Maritex
#
# Une backend (nm-backend), tienda (nm-ecommerce) y admin (nm-frontend).
#
# Requisitos:
#   - nm-backend/.env configurado (copia de .env.example)
#   - nm-backend/.env.docker (ya incluido en el repo)
#   - nm-deploy/.env (copia de .env.example)
#
# Uso:
#   cd nm-deploy
#   cp .env.example .env
#   docker compose up -d --build
#
# Acceso directo (sin reverse-proxy):
#   Tienda:  http://localhost:3015
#   Admin:   http://localhost:8080
#   API:     http://localhost:3000
#
# Con reverse-proxy (perfil edge):
#   docker compose --profile edge up -d --build
#   Tienda:  http://novedadesmaritex.net.pe  (o Host header + localhost:80)
#   Admin:   http://app.novedadesmaritex.net.pe
#   API:     http://api.novedadesmaritex.net.pe
#
# Observabilidad (perfil observability — Grafana/Loki/Promtail):
#   docker compose --profile observability up -d
#   Grafana local: http://localhost:3010
#   Con edge + observability: https://grafana.novedadesmaritex.net.pe
# =============================================================================

name: nm

include:
  - path: ../nm-backend/docker-compose.full.yml
    project_directory: ../nm-backend
  - path: ./docker-compose.observability.yml

services:
  storefront:
    build:
      context: ../nm-ecommerce
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3015}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-51901259663}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
        NEXT_PUBLIC_CULQI_PUBLIC_KEY: ${NEXT_PUBLIC_CULQI_PUBLIC_KEY:-}
        API_BASE_URL: http://gateway:3000/api/v1
    image: nm-storefront:latest
    container_name: nm_storefront
    restart: unless-stopped
    environment:
      TZ: America/Lima
      API_BASE_URL: http://gateway:3000/api/v1
      ECOMMERCE_SERVICE_URL: http://ecommerce-service:3012
      STORE_WAREHOUSE_ID: ${STORE_WAREHOUSE_ID:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3015}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-51901259663}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
      NEXT_PUBLIC_CULQI_PUBLIC_KEY: ${NEXT_PUBLIC_CULQI_PUBLIC_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    ports:
      - "${STOREFRONT_PORT:-3015}:3015"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started
      ecommerce-service:
        condition: service_started
    networks:
      - default

  admin:
    build:
      context: ../nm-frontend
      dockerfile: Dockerfile
      args:
        NG_CONFIGURATION: ${NG_CONFIGURATION:-docker}
    image: nm-admin:latest
    container_name: nm_admin
    restart: unless-stopped
    environment:
      TZ: America/Lima
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    networks:
      - default

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: nm_reverse_proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TZ: America/Lima
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - storefront
      - admin
      - gateway
      - chatbot-service
    networks:
      - default
    profiles:
      - edge

  certbot:
    image: certbot/certbot:latest
    container_name: nm_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    profiles:
      - edge

volumes:
  certbot_www:
    name: nm_certbot_www
  certbot_certs:
    name: nm_certbot_certs
