# Producción — HTTPS + redirect HTTP → HTTPS
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# ── Tienda ────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name novedadesmaritex.net.pe www.novedadesmaritex.net.pe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name novedadesmaritex.net.pe www.novedadesmaritex.net.pe;

    ssl_certificate /etc/letsencrypt/live/novedadesmaritex.net.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novedadesmaritex.net.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location / {
        proxy_pass http://storefront:3015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ── Admin ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name app.novedadesmaritex.net.pe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.novedadesmaritex.net.pe;

    ssl_certificate /etc/letsencrypt/live/novedadesmaritex.net.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novedadesmaritex.net.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    location / {
        proxy_pass http://admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

