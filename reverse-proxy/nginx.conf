# =============================================================================
# Reverse proxy — rutas por dominio (perfil edge)
# TLS: monta certificados en ./certs y descomenta el bloque ssl en cada server.
# Local: añade a /etc/hosts:
#   127.0.0.1 novedadesmaritex.net.pe www.novedadesmaritex.net.pe
#   127.0.0.1 app.novedadesmaritex.net.pe
#   127.0.0.1 api.novedadesmaritex.net.pe
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# ── Tienda (Next.js) ──────────────────────────────────────────────────────────

server {
    listen 80;
    server_name novedadesmaritex.net.pe www.novedadesmaritex.net.pe;

    client_max_body_size 20m;

    location / {
        proxy_pass http://storefront:3015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ── Admin ERP (Angular SPA) ───────────────────────────────────────────────────

server {
    listen 80;
    server_name app.novedadesmaritex.net.pe;

    location / {
        proxy_pass http://admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API (NestJS gateway) ──────────────────────────────────────────────────────

server {
    listen 80;
    server_name api.novedadesmaritex.net.pe;

    client_max_body_size 50m;

    location / {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
